apiVersion: apps/v1
kind: Deployment
metadata:
  name: socio-web
  namespace: socio
spec:
  replicas: 2
  selector:
    matchLabels: { app: socio-web }
  template:
    metadata:
      labels: { app: socio-web }
    spec:
      serviceAccountName: socio
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/replace/socio-web:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: socio-config }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: socio-web
  namespace: socio
spec:
  selector: { app: socio-web }
  ports:
    - { name: http, port: 3000, targetPort: http }
