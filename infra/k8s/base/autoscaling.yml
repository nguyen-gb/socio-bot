apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: socio-api
  namespace: socio
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: socio-api }
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: socio-browser-worker
  namespace: socio
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: socio-browser-worker }
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 900
      policies:
        - { type: Pods, value: 1, periodSeconds: 300 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 75 }
