apiVersion: v1
kind: Secret
metadata:
  name: socio-secrets
  namespace: socio
type: Opaque
stringData:
  DATABASE_URL: postgresql://replace:replace@postgres.example.com:5432/socio?schema=public
  CONTROL_API_KEY: replace-with-at-least-32-random-characters
  REMOTE_SESSION_SECRET: replace-with-an-independent-32-character-secret
  ACCESS_TOKEN_SECRET: replace-with-an-independent-32-character-secret
  BOOTSTRAP_ADMIN_PASSWORD: replace-with-a-strong-bootstrap-password
  PROFILE_ENCRYPTION_KEY: replace-with-base64-encoded-32-byte-key
  S3_ACCESS_KEY: replace
  S3_SECRET_KEY: replace
---
apiVersion: v1
kind: Secret
metadata:
  name: socio-proxy-secrets
  namespace: socio
type: Opaque
stringData:
  README: Store proxy JSON files here and mount only the keys referenced by file://.
