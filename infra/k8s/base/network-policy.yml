apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: socio-default-deny-ingress
  namespace: socio
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: socio-allow-internal-and-ingress
  namespace: socio
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 3000 }
        - { protocol: TCP, port: 3001 }
        - { protocol: TCP, port: 3010 }
