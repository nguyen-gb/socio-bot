server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: socio

scrape_configs:
  - job_name: socio-json
    static_configs:
      - targets: [localhost]
        labels:
          job: socio
          service_source: api
          __path__: /var/log/socio/api/*.jsonl
      - targets: [localhost]
        labels:
          job: socio
          service_source: browser-worker
          __path__: /var/log/socio/browser-worker/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
      - labels:
          level:
          service:
